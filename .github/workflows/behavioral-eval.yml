name: Behavioral Evaluation

# PARKED — manual trigger only. The tool this workflow is built on,
# github.com/sjnims/cc-plugin-eval, now returns 404: the clone step fails with
# "could not read Username for 'https://github.com'" (git prompting for
# credentials, which is what a 404 looks like in CI), so the job cannot pass on
# any PR. A check that can never go green is worse than no check — it trains
# everyone to read red as normal.
#
# Kept rather than deleted because the intent is still wanted: behavioural
# evaluation of auto-invoke skills. Restore the pull_request trigger below once
# a reachable evaluator exists (upstream returning, a fork, or a replacement).
# The `run` step was already continue-on-error for a separate reason — upstream
# had dropped the --components/--filter flags in favour of a config.yaml we
# never authored.
on:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install cc-plugin-eval
        # Upstream cc-plugin-eval has a peerDep conflict: madge@8 wants
        # typescript@^5.4.4, but the project pins typescript@^6.0.3.
        # `--legacy-peer-deps` lets npm resolve anyway; once upstream
        # fixes the conflict, this flag can come off.
        run: |
          git clone https://github.com/sjnims/cc-plugin-eval /tmp/cc-plugin-eval
          cd /tmp/cc-plugin-eval
          npm install --legacy-peer-deps && npm run build

      - name: Run evaluation (auto-invoke skills only)
        # Upstream CLI changed: `--components` and `--filter` flags were
        # removed in favour of a config.yaml. Until we author a proper
        # config + regenerate the baseline, treat this step as
        # informational (continue-on-error). The other 7 PR-blocking
        # checks (validate, test, lint, validate-counts/structure/hooks,
        # performance-report) remain authoritative.
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd /tmp/cc-plugin-eval
          npx cc-plugin-eval run -p $GITHUB_WORKSPACE/archon-os --dry-run \
            || echo "eval CLI surface drifted upstream — see workflow comment"

      - name: Check regression against baseline
        continue-on-error: true
        run: |
          if [ -f eval-results.json ]; then
            node archon-os/scripts/ci/check-eval-regression.cjs \
              --current eval-results.json \
              --baseline archon-os/eval-baseline.json \
              --threshold 0.85 \
              --max-drop 0.10
          else
            echo "no eval-results.json — eval did not run (upstream CLI drift)"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval-results.json
          retention-days: 14
